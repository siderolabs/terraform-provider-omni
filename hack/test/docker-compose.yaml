# Integration test harness for terraform-provider-omni.
#
# Brings up a throwaway Omni instance configured with its native OIDC auth provider pointed at a
# mock OIDC server (https://docs.siderolabs.com/omni/reference/omni-configuration#auth-oidc), so no
# external identity provider is required. Omni performs OIDC discovery against the provider URL at
# startup, which the mock server satisfies. The acceptance tests then authenticate with the
# bootstrapped service-account key (PGP-signed), so no interactive OIDC login ever happens.
#
# The etcd encryption private key is read from a checked-in throwaway PGP key via the file://
# private-key-source, so no Vault is needed either.

services:
  dex:
    image: dexidp/dex:v2.41.1
    container_name: dex
    ports:
      - "8080:8080"
    volumes:
      - ./dex.yaml:/etc/dex/config.yaml
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - omni-test

  # S3-compatible storage for the etcd backup tests. SeaweedFS has no environment-based credential
  # configuration for its S3 gateway, so the throwaway identity is mounted as a config file, and the
  # test buckets are created by run.sh once the gateway is up (there is no bucket auto-creation
  # either, and Omni validates a backup configuration by listing the bucket).
  s3:
    image: chrislusf/seaweedfs:4.41
    container_name: s3
    command:
      - server
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
      - -dir=/data
      # Bind on all interfaces so the healthcheck below can reach the gateway over loopback.
      - -ip.bind=0.0.0.0
    volumes:
      - ./s3-config.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "${S3_HOST_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - omni-test

  omni:
    image: ghcr.io/siderolabs/omni:${OMNI_VERSION:-latest}
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - ./certs:/certs:ro
      # Rendered from omni-config.yaml.tmpl by run.sh / run-proxmox.sh (see that file for details).
      - ./omni-config.yaml:/etc/omni/config.yaml:ro
      - omni-out:/_out
    ports:
      - "${OMNI_HOST_PORT:-8099}:8099"
      # Only published so a machine can reach the machine API and SideroLink from the host; the
      # machine-less suite never uses them. They are overridable because a developer running Omni
      # locally already holds these ports.
      - "${OMNI_MACHINE_API_HOST_PORT:-8090}:8090"
      - "${OMNI_SIDEROLINK_HOST_PORT:-50180}:50180/udp"
    command:
      - --config-path=/etc/omni/config.yaml
    networks:
      - omni-test
    depends_on:
      dex:
        condition: service_healthy
      s3:
        condition: service_healthy

volumes:
  omni-out:

networks:
  omni-test:
    driver: bridge
    # Lowered only where the host's own uplink is smaller, e.g. a VPN, which large packets from the
    # containers would otherwise not get through.
    driver_opts:
      com.docker.network.driver.mtu: "${OMNI_TEST_NETWORK_MTU:-1500}"
