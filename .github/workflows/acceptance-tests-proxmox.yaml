name: acceptance-tests-proxmox

# End-to-end test with real machines: a containerized Proxmox VE node runs the Talos VMs, which join a
# throwaway Omni with a join config passed as cloud-init user data, and the test exercises a cluster
# through bootstrap and scale up/down (see hack/test/run-proxmox.sh and the `proxmox`-tagged test in
# internal/integration).
#
# This is heavy (boots up to four Talos VMs), so it runs nightly, on pull requests, and on demand. It
# requires a runner with KVM and room for the VMs (≈16GB RAM and ≈50GB disk).

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
  workflow_dispatch:
    inputs:
      omni_version:
        description: Omni image tag to test against
        required: false
        default: latest

env:
  OMNI_VERSION: ${{ github.event.inputs.omni_version || 'latest' }}

jobs:
  acceptance-proxmox:
    runs-on:
      group: large
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper replaces the binary with a shell script, which the provider test framework
          # cannot exec as a Terraform CLI.
          terraform_wrapper: false

      - name: Run Proxmox end-to-end test
        # See the note in acceptance-tests.yaml: sudo resets PATH, so the path is resolved here.
        run: sudo -E env TF_ACC_TERRAFORM_PATH="$(command -v terraform)" ./hack/test/run-proxmox.sh

      - name: Upload Omni logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omni-proxmox-logs
          path: /tmp/omni-tf-acc-proxmox.log
          if-no-files-found: ignore
