name: acceptance-tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      omni_version:
        description: Omni image tag to test against
        required: false
        default: latest

env:
  OMNI_VERSION: ${{ github.event.inputs.omni_version || 'latest' }}

jobs:
  acceptance:
    runs-on:
      group: generic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper replaces the binary with a shell script, which the provider test framework
          # cannot exec as a Terraform CLI.
          terraform_wrapper: false

      - name: Run acceptance tests
        # TF_ACC_TERRAFORM_PATH is resolved out here rather than inside the script: sudo resets PATH
        # via secure_path, so the Terraform installed above is not on it as root.
        run: sudo -E env TF_ACC_TERRAFORM_PATH="$(command -v terraform)" ./hack/test/run.sh

      - name: Upload Omni logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omni-logs
          path: /tmp/omni-tf-acc.log
          if-no-files-found: ignore
